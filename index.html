<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>City Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1a14;--panel:#16261c;--edge:#2c4a37;--card:#1b3023;--amber:#f5b73b;--road:#35b8e6;--cream:#f3ecd6;--mute:#a9c2ae}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body,#gameScreen,#hud,#panel,#tabbar,#questBanner{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--ink);color:var(--cream);overflow-x:hidden}
h1,.cityname,.chip,.card h3,.bldg .lb{font-family:"Baloo 2",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;border:1px solid var(--edge);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--amber);color:#231303;font-weight:700}
button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:default}
.btn-alt{background:#24402f;color:var(--cream)}.btn-danger{background:#991b1b;color:#fff}.btn-blue{background:#1d4ed8;color:#fff}
h1{font-size:28px}
#filesScreen{max-width:480px;margin:0 auto;padding:28px 16px 60px}
#filesScreen h1{text-align:center;margin-bottom:4px}
#filesScreen .sub{text-align:center;color:var(--mute);margin-bottom:22px;font-size:14px}
.filepill{background:var(--amber);color:#231303;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
.slot{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:14px;margin-bottom:12px}
.slot-title{font-size:17px;font-weight:700}.slot-meta{font-size:13px;opacity:.85;margin:3px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot input,input[type=text]{flex:1;min-width:140px;padding:8px 10px;border-radius:10px;border:1px solid var(--edge);background:var(--ink);color:var(--cream);font-size:14px}
.note{font-size:12px;opacity:.7;text-align:center;margin-top:14px;line-height:1.5}
#gameScreen{display:none}
#hud{position:sticky;top:8px;z-index:30;margin:8px;border-radius:18px;border:1px solid var(--edge);background:rgba(22,38,28,.94);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.45);padding:10px 12px 8px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.crest{font-size:24px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#1f3828;border:1px solid var(--edge)}
.cityname{font-weight:800;font-size:18px;line-height:1.1}
.yearline{font-size:12px;color:var(--mute)}
.daybar{flex:1;min-width:120px;height:8px;border-radius:99px;background:#0c150f;overflow:hidden}
.daybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd35a,var(--amber) 60%,#8b7cf6)}
.ctrls{display:flex;gap:6px}
.spdbtn{background:#1f3828;color:#cfe3d2;border:1px solid var(--edge);border-radius:12px;padding:6px 11px;font-size:13px;font-weight:700}
.spdbtn.on{background:var(--amber);color:#2a1a02;border-color:var(--amber)}
.spdbtn.filesb{background:#2a1a02;color:var(--amber);border-color:#7a5410}
#resbar{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
#resbar::-webkit-scrollbar{display:none}
.chip{font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:3px 12px;white-space:nowrap}
.chip.low{background:#3a1616;border-color:#dc2626;color:#ffb4b4;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(220,38,38,.25)}}
#questBanner{margin:0 8px;border-radius:14px;border:1px solid #1d5d78;background:linear-gradient(90deg,#0e3346,#12283a);color:#d8f2ff;padding:8px 14px;font-size:13px}
#mapWrap{position:relative;height:calc(100dvh - 200px);min-height:340px;margin:8px 8px 96px;border-radius:18px;border:1px solid var(--edge);overflow:hidden;touch-action:none;contain:layout paint;transition:background 1s}
#mapWrap.day{background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 8px),linear-gradient(#78b958,#3f7f33)}
#mapWrap.dusk{background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 8px),linear-gradient(#c58a3d,#46763c)}
#mapWrap.night{background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 8px),linear-gradient(#1d3023,#101c14)}
#world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.street{position:absolute;background:var(--road);border-radius:6px;box-shadow:0 0 10px rgba(53,184,230,.7);opacity:.9;pointer-events:none}
.bldg{position:absolute;transform:translate(-50%,-80%);text-align:center;pointer-events:none}
.bldg .ic{font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.bldg .frame{font-size:15px;line-height:1}
.bldg .lb{font-size:10px;background:rgba(15,26,20,.85);border:1px solid var(--edge);border-radius:8px;padding:0 6px}
.bldg .prog{width:44px;height:5px;background:rgba(0,0,0,.5);border-radius:3px;margin:2px auto 0;overflow:hidden}
.bldg .prog i{display:block;height:100%;background:var(--amber)}
.person{position:absolute;transform:translate(-50%,-90%);text-align:center;transition:left .9s linear,top .9s linear;pointer-events:none;z-index:5;will-change:left,top}
.person .ic{font-size:20px}.person .bub{font-size:12px;height:14px}
.person .nm{font-size:8px;background:rgba(15,26,20,.8);border-radius:5px;padding:0 3px}
.raider .ic{filter:drop-shadow(0 0 4px #dc2626)}
#mapBtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:20}
.mbtn{width:44px;height:44px;border-radius:50%;background:rgba(15,26,20,.92);color:var(--cream);border:1px solid var(--edge);font-size:20px;padding:0;box-shadow:0 3px 12px rgba(0,0,0,.4)}
#panel{position:fixed;left:50%;bottom:84px;width:min(720px,calc(100% - 20px));max-height:48dvh;overflow:auto;z-index:35;background:rgba(15,26,20,.97);border:1px solid var(--edge);border-radius:20px;padding:12px;box-shadow:0 -8px 30px rgba(0,0,0,.5);transform:translate(-50%,calc(100% + 120px));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
body.sheet-open #panel{transform:translate(-50%,0)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{font-size:16px;margin-bottom:6px}.card p{font-size:13px;opacity:.9;line-height:1.45}
.card .row{margin-top:8px}.cost,.small{font-size:12px;opacity:.85}
.bar{height:8px;background:#0c150f;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd35a,var(--amber))}
#tabbar{position:fixed;left:50%;bottom:10px;width:min(860px,calc(100% - 20px));transform:translateX(-50%);z-index:40;display:flex;gap:6px;padding:6px;border:1px solid var(--edge);border-radius:20px;background:rgba(15,26,20,.95);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
#tabbar button{flex:1;background:none;border:none;border-radius:14px;padding:7px 2px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
#tabbar button.on{background:#24402f;color:var(--amber);box-shadow:inset 0 0 0 1px #3f6b4f}
.tic{font-size:19px}
.jobrow,.personrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--edge);font-size:13px}
.jobrow:last-child,.personrow:last-child{border-bottom:none}.grow{flex:1}
.pm{width:34px;height:34px;font-size:18px;padding:0;border-radius:9px}
.toast{position:fixed;left:50%;top:150px;transform:translateX(-50%);background:rgba(22,38,28,.97);border:1px solid var(--edge);color:var(--cream);padding:12px 18px;border-radius:16px;font-size:14px;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.5);max-width:92vw;text-align:center;animation:drop .3s ease-out}
@keyframes drop{from{transform:translate(-50%,-12px);opacity:0}}
@media(prefers-reduced-motion:reduce){.chip.low,.toast{animation:none}#panel{transition:none}.person{transition:none}}
</style>
</head>
<body>
<div id="filesScreen">
  <div style="text-align:center;font-size:46px;line-height:1.1">🔥</div>
  <h1>City Simulator</h1>
  <div class="sub">An incremental city builder — Stone Age to the Sky Age</div>
  <div id="slots"></div>
  <div class="note">💾 Saves live in this browser on this device.</div>
</div>
<div id="gameScreen">
  <div id="hud">
    <div class="toprow">
      <div class="brand"><span class="crest">🏕️</span><div><div class="cityname" id="hudCity">City</div><div class="yearline" id="hudYear">Year 1</div></div></div>
      <div class="daybar"><i id="dayFill"></i></div>
      <div class="ctrls">
        <button class="spdbtn" data-spd="0" onclick="setSpeed(0)">⏸</button>
        <button class="spdbtn" data-spd="1" onclick="setSpeed(1)">1×</button>
        <button class="spdbtn" data-spd="2" onclick="setSpeed(2)">2×</button>
        <button class="spdbtn" data-spd="4" onclick="setSpeed(4)">4×</button>
        <button class="spdbtn filesb" onclick="backToFiles()">📁 Files</button>
      </div>
    </div>
    <div id="resbar"></div>
    <span class="yearline" id="hudSave">💾 Saved</span>
  </div>
  <div id="questBanner"></div>
  <div id="mapWrap" class="day"></div>
  <div id="panel"></div>
  <div id="tabbar">
    <button data-tab="build"><span class="tic">🔨</span>Build</button>
    <button data-tab="jobs"><span class="tic">💼</span>Jobs</button>
    <button data-tab="quests"><span class="tic">📜</span>Quests</button>
    <button data-tab="research"><span class="tic">🔬</span>Research</button>
    <button data-tab="people"><span class="tic">🧑‍🤝‍🧑</span>People</button>
    <button data-tab="log"><span class="tic">📖</span>Log</button>
    <button data-tab="settings"><span class="tic">⚙️</span>Settings</button>
  </div>
</div>
<script>
"use strict";
const SAVE_KEY="citysim_github_v1",DAY_MS=12000;
const NAMES=["Zara","Finn","Seamus","Tara","Luna","Kai","Milo","Ivy","Rex","Noor","Elif","Bram","Sana","Otto","Priya","Hugo","Mira","Dario","Lena","Yusuf","Ana","Cole","Ruth","Ezra","Nia","Sol","Uma","Vera","Wade","Xiu"];
const ERAS=["Stone Age","Village Age","Bronze Age","Industrial Age","Sky Age"];
const JOBS={gatherer:{name:"Gatherer",icon:"🧺"},woodcutter:{name:"Woodcutter",icon:"🪓"},hunter:{name:"Hunter",icon:"🏹"},fisher:{name:"Fisher",icon:"🎣"},farmer:{name:"Farmer",icon:"🌾",need:"farm"},builder:{name:"Builder",icon:"🔨"},researcher:{name:"Researcher",icon:"🔬"},warrior:{name:"Warrior",icon:"⚔️"},teacher:{name:"Teacher",icon:"📚",need:"school"},student:{name:"Student",icon:"🎒"},doctor:{name:"Doctor",icon:"🩺",need:"hospital",era:3},nurse:{name:"Nurse",icon:"💉",need:"hospital",era:3},cook:{name:"Cook",icon:"👨‍🍳",need:"restaurant",era:3},firefighter:{name:"Firefighter",icon:"🧑‍🚒",need:"firestation",era:3},officer:{name:"Officer",icon:"👮",need:"policestation",era:3},clergy:{name:"Clergy",icon:"🙏",need:"church",era:3}};
const BUILDINGS={tent:{name:"Tent",icon:"⛺",cost:{wood:10},home:2,tier:0},hut:{name:"Hut",icon:"🛖",cost:{wood:25,stone:5},home:3,tier:1,upgradeFrom:"tent"},house:{name:"House",icon:"🏠",cost:{wood:40,stone:25},home:4,tier:2,upgradeFrom:"hut"},skyloft:{name:"Sky Loft",icon:"🏙️",cost:{wood:60,stone:50,metal:20},home:5,tier:3,upgradeFrom:"house",era:4},campfire:{name:"Campfire",icon:"🔥",cost:{wood:8,stone:4}},farm:{name:"Farm",icon:"🌾",cost:{wood:20}},well:{name:"Well",icon:"🪣",cost:{stone:15}},granary:{name:"Granary",icon:"🏚️",cost:{wood:30,stone:10}},school:{name:"School",icon:"🛖",cost:{wood:35,stone:10},big:true},library:{name:"Library",icon:"📖",cost:{wood:45,stone:20},era:2},training:{name:"Training Grounds",icon:"🎯",cost:{wood:30,stone:15},era:1},park:{name:"Park",icon:"🌳",cost:{wood:15},era:1},church:{name:"Church",icon:"⛪",cost:{wood:60,stone:40},era:3},restaurant:{name:"Restaurant",icon:"🍽️",cost:{wood:55,stone:30},era:3},firestation:{name:"Fire Station",icon:"🚒",cost:{wood:60,stone:45},era:3},policestation:{name:"Police Station",icon:"🚓",cost:{wood:60,stone:45},era:3},hospital:{name:"Hospital",icon:"🏥",cost:{wood:70,stone:55},era:3},factory:{name:"Factory",icon:"🏭",cost:{wood:80,stone:60,metal:25},era:3},powerplant:{name:"Power Plant",icon:"⚡",cost:{wood:70,stone:60,metal:35},era:3},university:{name:"University",icon:"🎓",cost:{wood:110,stone:90,metal:30},era:4},skyport:{name:"Skyport",icon:"🛸",cost:{wood:90,stone:80,metal:60},era:4}};
const RESEARCH=[{id:"fire",name:"Fire Mastery",era:0,days:4,desc:"Campfires keep everyone warm. +morale"},{id:"tools",name:"Stone Tools",era:0,days:5,desc:"Woodcutters and gatherers work 30% faster"},{id:"farming",name:"Farming",era:0,days:6,desc:"Unlocks Farms and Farmers"},{id:"building",name:"Construction",era:0,days:6,desc:"Unlocks Huts and Wells"},{id:"wheel",name:"The Wheel",era:1,days:6,desc:"Builders work 30% faster"},{id:"education",name:"Education",era:1,days:7,desc:"Unlocks the School — education past level 2"},{id:"bronze",name:"Bronze Working",era:1,days:8,desc:"Unlocks metal and the Bronze Age",toEra:2},{id:"writing",name:"Writing",era:2,days:8,desc:"Unlocks the Library; research 25% faster"},{id:"math",name:"Mathematics",era:2,days:9,desc:"Everyone works 15% faster"},{id:"medicine0",name:"Herbal Medicine",era:2,days:8,desc:"Sick villagers recover faster"},{id:"engineering",name:"Engineering",era:2,days:10,desc:"Unlocks the modern era: money, church, hospital, fire & police",toEra:3},{id:"medicine",name:"Medicine",era:3,days:10,desc:"Doctors and nurses heal much faster"},{id:"computers",name:"Computers",era:3,days:11,desc:"Research 50% faster"},{id:"flight",name:"Flight",era:3,days:12,desc:"Unlocks the Sky Age",toEra:4},{id:"ecology",name:"Ecology",era:4,days:12,desc:"Farms and gatherers produce 30% more"},{id:"spaceflight",name:"Spaceflight",era:4,days:14,desc:"The final research. Your city touches the stars ⭐"}];
const RELIGIONS=["Sun Path","Moon Temple","River Spirits","Star Watchers","Earth Keepers","Sky Choir","Ember Faith","Tide Callers","Stone Circle","Light Bearers"];
const QUESTS=[
{id:"q1",name:"First Timber",desc:"Have 30 wood",check:s=>s.res.wood>=30,reward:{wood:10}},
{id:"q2",name:"Full Bellies",desc:"Have 30 food",check:s=>s.res.food>=30,reward:{food:10}},
{id:"q3",name:"A Growing Village",desc:"Reach 10 people",check:s=>s.people.filter(p=>p.alive).length>=10,reward:{wood:20}},
{id:"q4",name:"Warm Hearth",desc:"Build a Campfire",check:s=>has(s,"campfire"),reward:{food:15}},
{id:"q5",name:"First Farm",desc:"Research Farming and build a Farm",check:s=>has(s,"farm"),reward:{food:20}},
{id:"q6",name:"Shelter For All",desc:"Have 3 Huts or better",check:s=>s.buildings.filter(b=>["hut","house","skyloft"].includes(b.type)).length>=3,reward:{stone:15}},
{id:"q7",name:"First Discovery",desc:"Finish 3 research projects",check:s=>Object.keys(s.researchDone).length>=3,reward:{knowledge:15}},
{id:"q8",name:"Survive a Raid",desc:"Survive a raid",check:s=>s.raidsSurvived>=1,reward:{wood:25}},
{id:"q9",name:"Bronze Age",desc:"Reach the Bronze Age",check:s=>s.era>=2,reward:{metal:15}},
{id:"q10",name:"School Days",desc:"Build a School",check:s=>has(s,"school"),reward:{knowledge:20}},
{id:"q11",name:"Book Smart",desc:"Build a Library",check:s=>has(s,"library"),reward:{knowledge:25}},
{id:"q12",name:"Modern Times",desc:"Reach the Industrial Age",check:s=>s.era>=3,reward:{money:50}},
{id:"q13",name:"City Services",desc:"Build a Hospital, Fire Station and Police Station",check:s=>has(s,"hospital")&&has(s,"firestation")&&has(s,"policestation"),reward:{money:75}},
{id:"q14",name:"Faith & Food",desc:"Build a Church and a Restaurant",check:s=>has(s,"church")&&has(s,"restaurant"),reward:{money:60}},
{id:"q15",name:"Sky High",desc:"Reach the Sky Age",check:s=>s.era>=4,reward:{metal:40}},
{id:"q16",name:"To The Stars",desc:"Finish Spaceflight — the final quest ⭐",check:s=>!!s.researchDone.spaceflight,reward:{money:200}}];
function has(s,t){return s.buildings.some(b=>b.type===t&&!b.building)}

/* ---------- state ---------- */
let store=loadStore(),S=null,activeSlot=-1,tab="build",selPerson=null,tickTimer=null,lastTick=0,raidFx=null,uidC=1;
let hudAcc=0,stepAcc=0,prodCache=null,prodAt=0,lastResHtml="",view={z:1,x:0,y:0};
const personEls=new Map(),bldgEls=new Map();
function loadStore(){try{const r=localStorage.getItem(SAVE_KEY);if(r){const d=JSON.parse(r);if(Array.isArray(d.slots))return d}}catch(e){}return{slots:[null,null,null,null,null]}}
function saveStore(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(store))}catch(e){}}
const fmt=n=>Math.floor(n).toLocaleString(),$=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function log(m){if(!S)return;S.log.unshift("Year "+S.year+" — "+m);S.log=S.log.slice(0,40);if(tab==="log")renderPanel()}
function newPerson(age,x,y){
  const used=S?S.people.map(p=>p.name):[];let name=NAMES[Math.floor(Math.random()*NAMES.length)],g=0;
  while(used.includes(name)&&g++<50)name=NAMES[Math.floor(Math.random()*NAMES.length)]+" "+"ABCDEFGH"[Math.floor(Math.random()*8)]+".";
  const likes={},talent={};
  Object.keys(JOBS).forEach(j=>{const r=Math.random();likes[j]=r<.3?"love":r<.6?"chore":"ok";talent[j]=.7+Math.random()*.6});
  return{id:uidC++,name,age,job:age>=18?"gatherer":"kid",alive:true,x:x??20+Math.random()*60,y:y??62+Math.random()*28,tx:0,ty:0,home:null,partner:null,edu:age>=18?10+Math.random()*25:0,skills:{},likes,talent,health:100,downedUntil:0,sick:0,religion:null};
}
function newGame(cityName){
  uidC=1;
  const s={cityName,year:1,era:0,dayFrac:0,res:{wood:40,food:35,water:30,stone:10,knowledge:0,metal:0,money:0},people:[],buildings:[],researchDone:{},researchSaved:{},researchActive:null,researchProgress:0,questIdx:0,questsDone:{},raidsSurvived:0,log:[],speed:1,paused:false,manualJobs:false,jobCounts:{},raidIn:10,bornTotal:0};
  S=s;
  for(let i=0;i<6;i++)s.people.push(newPerson(19+Math.floor(Math.random()*22)));
  for(let i=0;i<3;i++)s.buildings.push({id:uidC++,type:"tent",x:10+i*11,y:26,building:false,progress:1,tier:0});
  assignHomes();autoJobs();log("🏕️ "+cityName+" is founded with 6 people and 3 tents.");return s;
}
const eduLevel=p=>p.edu>=80?4:p.edu>=60?3:p.edu>=20?2:1;
const eduName=l=>["","Unschooled","Schooled","Educated","Scholar"][l];
const jobLevel=(p,j)=>Math.min(5,1+Math.floor(Math.sqrt(((p.skills&&p.skills[j])||0)/12)));
const jobMult=(p,j)=>1+(jobLevel(p,j)-1)*.27;
const alive=()=>S.people.filter(p=>p.alive);
const hasB=t=>S.buildings.some(b=>b.type===t&&!b.building);
const countB=t=>S.buildings.filter(b=>b.type===t&&!b.building).length;
function jobAvailable(j){const d=JOBS[j];if(!d)return false;if(d.era!==undefined&&S.era<d.era)return false;if(d.need&&!hasB(d.need))return false;return true}
const scoreFor=(p,j)=>jobLevel(p,j)*2+(p.talent[j]||1)+(p.likes[j]==="love"?1.5:p.likes[j]==="chore"?-1:0);
function autoJobs(){
  prodCache=null;
  if(!S)return;if(S.manualJobs){applyManualJobs();return}
  const ps=alive();ps.forEach(p=>{if(p.age<6)p.job="kid"});
  const workers=ps.filter(p=>p.age>=18);
  ps.filter(p=>p.age>=6&&p.age<18).forEach(p=>p.job=hasB("school")?"student":"kid");
  const want=[],push=(j,n)=>{for(let i=0;i<n;i++)want.push(j)},n=workers.length,r=x=>Math.max(1,Math.round(n*x));
  push("gatherer",r(.18));push("woodcutter",r(.18));push("hunter",r(.12));
  if(hasB("farm"))push("farmer",r(.16));else push("fisher",r(.10));
  if(S.buildings.some(b=>b.building))push("builder",r(.16));
  if(S.researchActive)push("researcher",r(.14));
  push("warrior",S.raidIn<=3?r(.14):Math.round(n*.06));
  if(hasB("school"))push("teacher",1);
  ["doctor","nurse","cook","firefighter","officer","clergy"].forEach(j=>{if(jobAvailable(j))push(j,1)});
  const pool=workers.slice();workers.forEach(p=>p.job="gatherer");
  [...new Set(want)].forEach(j=>{const c=want.filter(x=>x===j).length;for(let k=0;k<c&&pool.length;k++){pool.sort((a,b)=>scoreFor(b,j)-scoreFor(a,j));pool.shift().job=j}});
  if(!workers.some(p=>p.job==="woodcutter")&&workers.length)workers[0].job="woodcutter";
  if(!workers.some(p=>["gatherer","hunter","fisher","farmer"].includes(p.job))&&workers.length>1)workers[1].job="gatherer";
}
function applyManualJobs(){

  Object.keys(S.jobCounts).forEach(j=>{
    if(j==="gatherer")return;let c=jobAvailable(j)?S.jobCounts[j]||0:0;
    const cand=workers.filter(p=>p.job==="gatherer").sort((a,b)=>scoreFor(b,j)-scoreFor(a,j));
    for(let k=0;k<c&&k<cand.length;k++)cand[k].job=j;
  });

/* ---------- simulation ---------- */
function productionPerDay(){
  const o={wood:0,food:0,water:0,stone:0,knowledge:0,metal:0,money:0},rd=S.researchDone;
  const tb=rd.tools?1.3:1,mb=rd.math?1.15:1,eb=rd.ecology?1.3:1,ps=alive();
  ps.filter(p=>p.age>=18).forEach(p=>{
    const m=jobMult(p,p.job)*mb;
    switch(p.job){
      case"woodcutter":o.wood+=7*m*tb;break;
      case"gatherer":o.food+=4.2*m*tb*eb;o.wood+=1.2*m;break;
      case"hunter":o.food+=6*m;break;case"fisher":o.food+=5.4*m;break;case"farmer":o.food+=8*m*eb;break;
      case"researcher":o.knowledge+=3.4*m;break;
      case"cook":o.food+=2*m;if(S.era>=3)o.money+=4*m;break;
      case"doctor":case"nurse":if(S.era>=3)o.money+=2.5*m;break;
      case"firefighter":case"officer":case"clergy":if(S.era>=3)o.money+=1.6*m;break;
    }
  });
  o.water+=6+countB("well")*14+ps.length*.4;
  if(S.era>=2&&rd.bronze)o.metal+=ps.filter(p=>p.job==="woodcutter").length*.5;
  if(hasB("factory"))o.money+=9;if(hasB("skyport"))o.money+=16;if(hasB("powerplant"))o.money+=4;
  return o;
}
function gainXp(p,j,a){
  if(!p.skills)p.skills={};
  p.skills[j]=(p.skills[j]||0)+a*(p.likes[j]==="love"?1.4:p.likes[j]==="chore"?.6:1)*(p.talent[j]||1)*(.7+eduLevel(p)*.15);
}
function dayRollover(){
  S.year++;S.raidIn--;const ps=alive();
  S.res.food-=ps.length;S.res.water-=ps.length*.8;let starving=false;
  if(S.res.food<0){S.res.food=0;starving=true}if(S.res.water<0){S.res.water=0;starving=true}
  if(starving){ps.forEach(p=>p.health-=12);log("⚠️ Not enough food or water — people are going hungry!")}
  ps.forEach(p=>{p.age++;if(p.age>68&&Math.random()<(p.age-68)*.012){p.alive=false;log("🕯️ "+p.name+" passed away at "+p.age+".")}if(p.health<=0)p.health=25});
  const A=alive(),doc=A.some(q=>q.job==="doctor"),nur=A.some(q=>q.job==="nurse"),care=(hasB("hospital")?14:4)+(doc?10:0)+(nur?6:0);
  A.forEach(p=>{if(p.health<100)p.health=Math.min(100,p.health+care*(S.researchDone.medicine?1.6:1))});
  const singles=A.filter(p=>p.age>=20&&p.age<=45&&!p.partner);
  for(let i=0;i+1<singles.length;i+=2)if(Math.random()<.5){singles[i].partner=singles[i+1].id;singles[i+1].partner=singles[i].id}
  const cap=S.buildings.filter(b=>!b.building&&BUILDINGS[b.type].home).reduce((a,b)=>a+BUILDINGS[b.type].home,0);
  if(A.length<cap+2){const c=A.filter(p=>p.partner&&p.age>=21&&p.age<=42);
    if(c.length&&Math.random()<.45){const baby=newPerson(0,c[0].x,c[0].y);S.people.push(baby);S.bornTotal++;log("👶 "+baby.name+" was born!");toast("👶 "+baby.name+" was born!")}}
  const ecap=hasB("school")?100:59,teach=A.some(q=>q.job==="teacher");
  A.forEach(p=>{if(p.job==="student")p.edu=Math.min(ecap,p.edu+(teach?9:5));else if(p.age>=18)p.edu=Math.min(ecap,p.edu+.7)});
  S.strikeToday=[];
  if(S.researchActive){A.filter(p=>p.job==="researcher").forEach(p=>{if(Math.random()<(p.likes.researcher==="chore"?.38:p.likes.researcher==="love"?.06:.16))S.strikeToday.push(p.id)});
    if(S.strikeToday.length)log("🥱 "+S.strikeToday.map(id=>(S.people.find(p=>p.id===id)||{}).name).join(", ")+" doesn't feel like researching today.")}
  if(S.era>=3)S.res.money+=A.length*1.5;
  if(S.raidIn<=0){startRaid();S.raidIn=10}
  autoJobs();assignHomes();checkQuests();saveGame(false);renderAll();
}
function checkQuests(){
  for(;;){const q=QUESTS[S.questIdx];if(!(q&&q.check(S)))break;
    Object.keys(q.reward).forEach(k=>S.res[k]=(S.res[k]||0)+q.reward[k]);S.questsDone[q.id]=true;log("📜 Quest complete: "+q.name+"!");toast("📜 Quest complete: "+q.name);S.questIdx++}
}
function startRaid(){
  const f=alive().filter(p=>p.age>=18),n=Math.max(1,Math.min(4,Math.round(f.length*.35)));
  raidFx={t:0,raiders:Array.from({length:n},(_,i)=>({x:-4-i*4,y:30+Math.random()*40,el:null}))};log("⚔️ Raiders are attacking "+S.cityName+"!");
}
function resolveRaid(){
  const defs=alive().filter(p=>p.age>=18),war=defs.filter(p=>p.job==="warrior");
  const power=war.reduce((a,p)=>a+jobMult(p,"warrior"),0)+defs.length*.25,rp=raidFx?raidFx.raiders.length*1.1:1,kn=[];
  defs.forEach(p=>{if(Math.random()<.4){p.downedUntil=S.year+1;p.health=Math.max(20,p.health-25);kn.push(p.name)}});
  const tail=kn.length?" Knocked down: "+kn.join(", ")+" (they'll recover).":"";
  if(power>=rp)log("🛡️ The raid was driven off!"+tail);
  else{S.res.food-=Math.min(S.res.food,12);S.res.wood=Math.max(0,S.res.wood-8);log("🏴 Raiders got away with some supplies."+tail)}
  S.raidsSurvived++;war.forEach(p=>gainXp(p,"warrior",6));raidFx=null;checkQuests();
}
function tick(now){
  if(!S)return;
  const dt=Math.min(100,now-lastTick);lastTick=now;
  if(S.paused)return;
  const dr=(dt/DAY_MS)*(S.speed||1);S.dayFrac+=dr;
  if(!prodCache||now-prodAt>500){prodCache=productionPerDay();prodAt=now}
  Object.keys(prodCache).forEach(k=>S.res[k]+=prodCache[k]*dr);
  const building=S.buildings.filter(b=>b.building);
  if(building.length){
    const builders=alive().filter(p=>p.job==="builder"&&p.age>=18);
    building.forEach((b,idx)=>{
      const crew=builders.filter((_,i)=>i%building.length===idx);
      b.progress+=(crew.reduce((a,p)=>a+jobMult(p,"builder"),0)*(S.researchDone.wheel?1.3:1)/5)*dr;crew.forEach(p=>gainXp(p,"builder",dr*2));
      if(b.progress>=1){b.building=false;b.progress=1;log("🏠 "+BUILDINGS[b.type].name+" finished building!");autoJobs();assignHomes();checkQuests()}
    });
  }
  if(S.researchActive){
    const proj=RESEARCH.find(r=>r.id===S.researchActive),w=alive().filter(p=>p.job==="researcher"&&!(S.strikeToday||[]).includes(p.id));
    S.researchProgress+=(w.reduce((a,p)=>a+jobMult(p,"researcher"),0)*(S.researchDone.writing?1.25:1)*(S.researchDone.computers?1.5:1)/3.2)*dr;
    w.forEach(p=>gainXp(p,"researcher",dr*2));
    if(proj&&S.researchProgress>=proj.days){
      S.researchDone[proj.id]=true;S.researchSaved[proj.id]=0;S.researchProgress=0;log("🔬 Research complete: "+proj.name+"!");toast("🔬 "+proj.name+" researched!");
      if(proj.toEra!==undefined&&proj.toEra>S.era){S.era=proj.toEra;log("🌟 Welcome to the "+ERAS[S.era]+"!")}
      S.researchActive=null;autoJobs();checkQuests();
    }
  }
  if(Math.random()<.3)alive().filter(p=>p.age>=18).forEach(p=>gainXp(p,p.job,dr*1.4));
  if(raidFx){raidFx.t+=dt;if(raidFx.t>6000)resolveRaid()}
  if(S.dayFrac>=1){S.dayFrac=0;dayRollover()}
  hudAcc+=dt;stepAcc+=dt;
  if(hudAcc>250){hudAcc=0;renderHud()}
  if(stepAcc>900){stepAcc=0;stepPeople()}
}

  if(tab==="log")h='<div class="card"><h3>📖 Log</h3><p style="line-height:1.65">'+(S.log.length?S.log.map(esc).join("<br>"):"Nothing yet.")+"</p></div>";
  if(tab==="settings")h='<div class="card"><h3>⚙️ Settings</h3><p>City name</p><div class="row"><input type="text" id="cityNameIn" value="'+esc(S.cityName)+'"><button onclick="renameCity()">Save name</button></div><p class="small" style="margin-top:10px">⏳ 1 day = 1 year · Raids every 10 years · Saves live in this browser.</p><div class="row" style="margin-top:12px"><button class="btn-blue" onclick="backToFiles()">📁 Save files</button></div><div class="row" style="margin-top:14px"><button class="btn-danger" onclick="restartCity()">🗑️ Restart this city</button></div></div>';
  P.innerHTML=h||'<div class="card"><p>Nothing here yet.</p></div>';
}
function personCard(p){
  const sk=Object.keys(p.skills||{}).filter(j=>p.skills[j]>0).sort((a,b)=>p.skills[b]-p.skills[a]).slice(0,5).map(j=>JOBS[j].icon+" "+JOBS[j].name+" ⭐"+jobLevel(p,j)).join("<br>");
  return'<div class="card"><h3>'+esc(p.name)+"</h3><p>Age "+p.age+" · "+(JOBS[p.job]?JOBS[p.job].name:p.job)+(p.age>=18?" ⭐ level "+jobLevel(p,p.job):"")+"<br>🎓 Education: Lv"+eduLevel(p)+" "+eduName(eduLevel(p))+" ("+Math.floor(p.edu)+"%)"+
    (p.partner?"<br>💕 Partner: "+esc((S.people.find(q=>q.id===p.partner)||{}).name||"?"):"")+(p.religion?"<br>🙏 "+esc(p.religion):"")+"<br>❤️ Health: "+Math.round(p.health)+"%"+(sk?"<br><br>⭐ <b>Job skills</b><br>"+sk:"")+
    '</p><div class="row"><button class="btn-alt" onclick="selPerson=null;renderPanel()">← Back</button></div></div>';
}

/* ---------- actions ---------- */
function queueBuild(t){
  const d=BUILDINGS[t];if(!canAfford(d.cost)){toast("Not enough resources");return}payCost(d.cost);
  const rows=[26,44,62],cols=[10,21,32,43,54,65,76,87],taken=new Set(S.buildings.map(b=>Math.round(b.x)+","+Math.round(b.y)));let spot=null;
  for(const ry of rows){for(const cx of cols)if(!taken.has(cx+","+ry)){spot=[cx,ry];break}if(spot)break}
  if(!spot)spot=[8+(S.buildings.length*7)%84,rows[S.buildings.length%3]];
  S.buildings.push({id:uidC++,type:t,x:spot[0],y:spot[1],building:true,progress:0,tier:d.tier||0});
  toast("🚧 "+d.name+" queued!");autoJobs();saveGame(false);renderAll();
}
function queueUpgrade(id,up){
  const b=S.buildings.find(x=>x.id===id),d=BUILDINGS[up];if(!b||!canAfford(d.cost)){toast("Not enough resources");return}
  payCost(d.cost);b.type=up;b.building=true;b.progress=0;b.tier=d.tier||0;toast("🚧 Upgrading to "+d.name+"!");autoJobs();saveGame(false);renderAll();
}
function sellRes(k,a,pr){if((S.res[k]||0)<a){toast("Not enough to sell");return}S.res[k]-=a;S.res.money+=pr;toast("💰 Sold!");saveGame(false);renderAll()}
function startResearch(id){if(S.researchActive&&S.researchActive!==id)S.researchSaved[S.researchActive]=S.researchProgress;S.researchActive=id;S.researchProgress=S.researchSaved[id]||0;autoJobs();saveGame(false);renderPanel()}
function pauseResearch(){if(S.researchActive){S.researchSaved[S.researchActive]=S.researchProgress;S.researchActive=null}autoJobs();saveGame(false);renderPanel()}
function toggleManual(){S.manualJobs=!S.manualJobs;if(S.manualJobs){S.jobCounts={};Object.keys(JOBS).forEach(j=>S.jobCounts[j]=alive().filter(p=>p.job===j&&p.age>=18).length)}else autoJobs();saveGame(false);renderPanel()}
function adjJob(j,d){S.jobCounts[j]=Math.max(0,(S.jobCounts[j]||0)+d);applyManualJobs();saveGame(false);renderPanel()}
function setSpeed(v){if(v===0)S.paused=true;else{S.paused=false;S.speed=v;lastTick=performance.now()}saveGame(false);renderHud()}
function renameCity(){const v=$("cityNameIn").value.trim();if(v){S.cityName=v;toast("Renamed to "+v)}saveGame(false);renderAll()}
function restartCity(){if(!confirm("Restart this city from Year 1? This wipes this file."))return;const n=S.cityName;S=newGame(n);personEls.forEach(e=>e.remove());bldgEls.forEach(e=>e.remove());personEls.clear();bldgEls.clear();saveGame(false);renderAll();toast("Fresh start!")}
function backToFiles(){saveGame(false);stopLoop();S=null;activeSlot=-1;document.body.classList.remove("sheet-open");showFiles()}
function zoomIn(){view.z=Math.min(2.5,view.z*1.2);applyView()}
function zoomOut(){view.z=Math.max(.6,view.z/1.2);applyView()}
function resetView(){view={z:1,x:0,y:0};applyView()}

/* ---------- files screen ---------- */
function showFiles(){
  $("gameScreen").style.display="none";$("filesScreen").style.display="block";
  $("slots").innerHTML=store.slots.map((s,i)=>{
    if(!s)return'<div class="slot"><div class="slot-title"><span class="filepill">FILE '+(i+1)+'</span> Empty</div><div class="slot-meta">Start a brand-new city in this file</div><div class="row"><input type="text" id="cityIn'+i+'" placeholder="Name your city"><button onclick="startNew('+i+')">▶ Start</button></div></div>';
    const st=s.state;
    return'<div class="slot"><div class="slot-title"><span class="filepill">'+esc(s.fileName.toUpperCase())+"</span> "+esc(st.cityName)+'</div><div class="slot-meta">Year '+st.year+" · "+ERAS[st.era]+" · 👥 "+st.people.filter(p=>p.alive).length+" people · saved "+new Date(s.savedAt).toLocaleString()+'</div><div class="row"><button onclick="loadSlot('+i+')">▶ Load</button><input type="text" id="fileIn'+i+'" placeholder="Rename this file" value="'+esc(s.fileName)+'"><button class="btn-alt" onclick="renameSlot('+i+')">Rename</button><button class="btn-danger" onclick="deleteSlot('+i+')">Delete</button></div></div>';
  }).join("");
}
function startNew(i){const v=($("cityIn"+i).value||"").trim()||"New City";activeSlot=i;S=newGame(v);store.slots[i]={fileName:"File "+(i+1),savedAt:Date.now(),state:S};saveStore();enterGame()}
function loadSlot(i){const s=store.slots[i];if(!s)return;activeSlot=i;S=s.state;S.paused=false;uidC=10000+Math.floor(Math.random()*1000)+S.year;enterGame()}
function renameSlot(i){const v=($("fileIn"+i).value||"").trim();if(v&&store.slots[i]){store.slots[i].fileName=v;saveStore()}showFiles()}
function deleteSlot(i){if(!confirm("Delete File "+(i+1)+"? This can't be undone."))return;store.slots[i]=null;saveStore();showFiles()}
function enterGame(){
  $("filesScreen").style.display="none";$("gameScreen").style.display="block";
  personEls.clear();bldgEls.clear();$("mapWrap").innerHTML="";view={z:1,x:0,y:0};prodCache=null;lastResHtml="";
  alive().forEach(p=>{if(S.era>=3&&!p.religion)p.religion=RELIGIONS[Math.floor(Math.random()*RELIGIONS.length)]});
  tab="build";document.body.classList.remove("sheet-open");renderAll();startLoop();
}
(function(){
  const mw=$("mapWrap");let drag=null;
  mw.addEventListener("pointerdown",e=>{document.body.classList.remove("sheet-open");renderPanel();if(e.target.closest("#mapBtns"))return;drag={sx:e.clientX,sy:e.clientY,x:view.x,y:view.y}});
  mw.addEventListener("pointermove",e=>{if(!drag)return;view.x=drag.x+e.clientX-drag.sx;view.y=drag.y+e.clientY-drag.sy;applyView()});
  window.addEventListener("pointerup",()=>{drag=null});
  mw.addEventListener("wheel",e=>{e.preventDefault();view.z=Math.max(.6,Math.min(2.5,view.z*(e.deltaY<0?1.1:.9)));applyView()},{passive:false});
})();
document.querySelectorAll("#tabbar button").forEach(b=>b.addEventListener("click",()=>{
  const same=tab===b.dataset.tab,open=document.body.classList.contains("sheet-open");
  tab=b.dataset.tab;selPerson=null;document.body.classList.toggle("sheet-open",!(same&&open));renderPanel();
}));
showFiles();
</script>
</body>
</html>
