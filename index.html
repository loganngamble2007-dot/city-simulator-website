<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>City Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a2f1a; color: #f2f2e9; overflow-x: hidden; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 8px 12px; font-size: 14px; background: #3f6212; color: #fff; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  .btn-alt { background: #57534e; }
  .btn-danger { background: #991b1b; }
  .btn-blue { background: #1d4ed8; }
  h1 { font-size: 26px; }
  /* ---------- Files screen ---------- */
  #filesScreen { max-width: 560px; margin: 0 auto; padding: 28px 16px 60px; }
  #filesScreen h1 { text-align: center; margin-bottom: 4px; }
  #filesScreen .sub { text-align: center; opacity: .8; margin-bottom: 22px; font-size: 14px; }
  .slot { background: #243824; border: 2px solid #3f6212; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .slot .slot-title { font-size: 17px; font-weight: 700; }
  .slot .slot-meta { font-size: 13px; opacity: .85; margin: 3px 0 10px; }
  .slot .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .slot input { flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 10px; border: 1px solid #3f6212; background: #16241a; color: #fff; font-size: 14px; }
  .note { font-size: 12px; opacity: .7; text-align: center; margin-top: 14px; line-height: 1.5; }
  /* ---------- Game layout ---------- */
  #gameScreen { display: none; max-width: 900px; margin: 0 auto; padding-bottom: 86px; }
  #hud { position: sticky; top: 0; z-index: 30; background: #16241a; border-bottom: 2px solid #3f6212; padding: 8px 10px; }
  #hud .cityline { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  #hud .cityname { font-weight: 800; font-size: 17px; }
  #hud .yearline { font-size: 13px; opacity: .9; }
  #resbar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 2px; scrollbar-width: none; }
  #resbar::-webkit-scrollbar { display: none; }
  .chip { background: #243824; border: 1px solid #3f6212; border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
  .chip.low { border-color: #dc2626; color: #fca5a5; }
  #questBanner { background: #3b2f10; border-bottom: 1px solid #a16207; padding: 7px 12px; font-size: 13px; }
  #mapWrap { position: relative; height: 46vh; min-height: 300px; overflow: hidden; transition: background 1s; }
  #mapWrap.day { background: linear-gradient(#7ec8e3 0 55%, #5da24a 55% 100%); }
  #mapWrap.dusk { background: linear-gradient(#f2a65a 0 55%, #4c7a3f 55% 100%); }
  #mapWrap.night { background: linear-gradient(#16233f 0 55%, #24402a 55% 100%); }
  .deco { position: absolute; font-size: 22px; opacity: .9; pointer-events: none; }
  .bldg { position: absolute; transform: translate(-50%,-80%); text-align: center; pointer-events: none; }
  .bldg .ic { font-size: 30px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .bldg .lb { font-size: 9px; background: rgba(0,0,0,.45); color: #fff; border-radius: 6px; padding: 1px 4px; margin-top: -2px; }
  .bldg .prog { width: 44px; height: 5px; background: rgba(0,0,0,.5); border-radius: 3px; margin: 2px auto 0; overflow: hidden; }
  .bldg .prog i { display: block; height: 100%; background: #facc15; }
  .person { position: absolute; transform: translate(-50%,-90%); text-align: center; transition: left .9s linear, top .9s linear; pointer-events: none; z-index: 5; }
  .person .ic { font-size: 20px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  .person .nm { font-size: 8px; background: rgba(0,0,0,.45); color: #fff; border-radius: 5px; padding: 0 3px; }
  .person .bub { font-size: 12px; height: 14px; }
  .raider .ic { filter: drop-shadow(0 0 4px #dc2626); }
  #log { background: #101c12; font-size: 12px; padding: 8px 12px; max-height: 92px; overflow-y: auto; line-height: 1.55; border-bottom: 1px solid #2c4429; }
  /* ---------- Panels / tabs ---------- */
  #panel { padding: 12px; }
  .card { background: #243824; border: 1px solid #3f6212; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .card h3 { font-size: 15px; margin-bottom: 6px; }
  .card p { font-size: 13px; opacity: .9; line-height: 1.45; }
  .card .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .cost { font-size: 12px; opacity: .85; }
  .bar { height: 8px; background: #16241a; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: #84cc16; }
  #tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: #16241a; border-top: 2px solid #3f6212; display: flex; }
  #tabbar button { flex: 1; background: none; border-radius: 0; padding: 10px 2px; font-size: 12px; color: #d9f99d; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #tabbar button.on { background: #243824; color: #fff; }
  #tabbar .tic { font-size: 19px; }
  .jobrow, .personrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #2c4429; font-size: 13px; }
  .jobrow:last-child, .personrow:last-child { border-bottom: none; }
  .jobrow .grow, .personrow .grow { flex: 1; }
  .pm { width: 34px; height: 34px; font-size: 18px; padding: 0; border-radius: 9px; }
  select, input[type=text] { padding: 8px 10px; border-radius: 10px; border: 1px solid #3f6212; background: #16241a; color: #fff; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; box-shadow: 0 4px 18px rgba(0,0,0,.5); max-width: 92vw; text-align: center; }
  .small { font-size: 12px; opacity: .8; }
</style>
</head>
<body>

<div id="filesScreen">
  <h1>🏕️ City Simulator</h1>
  <div class="sub">An incremental city builder — Stone Age to the Sky Age</div>
  <div id="slots"></div>
  <div class="note">💾 Saves live in this browser on this device (that's how GitHub Pages saving works).<br>The full cloud-save version lives in Muse.</div>
</div>

<div id="gameScreen">
  <div id="hud">
    <div class="cityline">

</div>

<script>
/* ================= Engine ================= */
let store = loadStore();
let S = null;           // active game state
let activeSlot = -1;
let tab = "build";
let selPerson = null;
let tickTimer = null;
let lastTick = 0;
let raidFx = null;      // {raiders:[{x,y,hp,el}], t}
let uidC = 1;

function loadStore(){ try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const d = JSON.parse(raw); if (Array.isArray(d.slots)) return d; } } catch(e){} return { slots: [null,null,null,null,null] }; }
function saveStore(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(store)); } catch(e){} }
function fmt(n){ return Math.floor(n).toLocaleString(); }
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function log(msg){ if(!S) return; S.log.unshift("Year " + S.year + " — " + msg); S.log = S.log.slice(0, 40); renderLog(); }
function renderLog(){ if(!S) return; $("log").innerHTML = S.log.map(esc).join("<br>"); }

function newPerson(age, x, y){
  const used = S ? S.people.map(p=>p.name) : [];
  let name = NAMES[Math.floor(Math.random()*NAMES.length)];
  let guard = 0; while (used.includes(name) && guard++ < 50) name = NAMES[Math.floor(Math.random()*NAMES.length)] + " " + "ABCDEFGH"[Math.floor(Math.random()*8)] + ".";
  const likes = {}, talent = {};
  Object.keys(JOBS).forEach(j => { const r = Math.random(); likes[j] = r < 0.3 ? "love" : (r < 0.6 ? "chore" : "ok"); talent[j] = 0.7 + Math.random()*0.6; });
  return { id: uidC++, name, age, job: age >= 18 ? "gatherer" : "kid", alive: true, x: x ?? 20+Math.random()*60, y: y ?? 62+Math.random()*28,
    tx: 0, ty: 0, home: null, partner: null, edu: age >= 18 ? 10+Math.random()*25 : 0, skills: {}, likes, talent,
    health: 100, downedUntil: 0, sick: 0, religion: null, bub: "", bubT: 0 };
}
function newGame(cityName){
  uidC = 1;
  const s = { cityName, year: 1, era: 0, dayFrac: 0, res: { wood: 40, food: 35, water: 30, stone: 10, knowledge: 0, metal: 0, money: 0 },
    people: [], buildings: [], researchDone: {}, researchSaved: {}, researchActive: null, researchProgress: 0,
    questIdx: 0, questsDone: {}, raidsSurvived: 0, log: [], speed: 1, manualJobs: false, jobCounts: {}, raidIn: 10, bornTotal: 0 };
  S = s;
  for (let i = 0; i < 6; i++) s.people.push(newPerson(19 + Math.floor(Math.random()*22)));
  for (let i = 0; i < 3; i++) s.buildings.push({ id: uidC++, type: "tent", x: 18 + i*16, y: 66 + (i%2)*10, building: false, progress: 1, tier: 0 });
  assignHomes(); autoJobs();
  log("🏕️ " + cityName + " is founded with 6 people and 3 tents.");
  return s;
}
function eduLevel(p){ const e = p.edu; return e >= 80 ? 4 : e >= 60 ? 3 : e >= 20 ? 2 : 1; }
function eduName(l){ return ["","Unschooled","Schooled","Educated","Scholar"][l]; }
function jobLevel(p, j){ const xp = (p.skills && p.skills[j]) || 0; return Math.min(5, 1 + Math.floor(Math.sqrt(xp / 12))); }
function jobMult(p, j){ return 1 + (jobLevel(p, j) - 1) * 0.27; }
function adults(){ return S.people.filter(p => p.alive && p.age >= 18 && S.year > (p.downedUntil||0) - 1); }
function alive(){ return S.people.filter(p => p.alive); }
function hasB(t){ return S.buildings.some(b => b.type === t && !b.building); }
function countB(t){ return S.buildings.filter(b => b.type === t && !b.building).length; }

function jobAvailable(j){
  const d = JOBS[j]; if (!d) return false;
  if (d.era !== undefined && S.era < d.era) return false;
  if (d.need && !hasB(d.need)) return false;
  return true;
}
function autoJobs(){
  if (!S || S.manualJobs) { applyManualJobs(); return; }
  const ps = alive();
  ps.forEach(p => { if (p.age < 6) p.job = "kid"; });
  const workers = ps.filter(p => p.age >= 18);
  const kids = ps.filter(p => p.age >= 6 && p.age < 18);
  kids.forEach(p => p.job = hasB("school") ? "student" : "kid");
  const want = [];
  const push = (j, n) => { for (let i = 0; i < n; i++) want.push(j); };
  const n = workers.length;
  push("gatherer", Math.max(1, Math.round(n * 0.18)));
  push("woodcutter", Math.max(1, Math.round(n * 0.18)));
  push("hunter", Math.max(1, Math.round(n * 0.12)));
  if (hasB("farm")) push("farmer", Math.max(1, Math.round(n * 0.16)));
  else push("fisher", Math.max(1, Math.round(n * 0.10)));
  if (S.buildings.some(b => b.building)) push("builder", Math.max(1, Math.round(n * 0.16)));
  if (S.researchActive) push("researcher", Math.max(1, Math.round(n * 0.14)));
  push("warrior", S.raidIn <= 3 ? Math.max(1, Math.round(n * 0.14)) : Math.max(0, Math.round(n * 0.06)));
  if (hasB("school")) push("teacher", 1);
  ["doctor","nurse","cook","firefighter","officer","clergy"].forEach(j => { if (jobAvailable(j)) push(j, 1); });
  const pool = workers.slice();
  // survival guarantee: one woodcutter + one food gatherer first
  const give = (j) => { const i = pool.findIndex(p => p.job !== "warrior"); if (i >= 0) { pool[i].job = j; pool.splice(i,1); } };
  workers.forEach(p => p.job = "gatherer");
  const order = want.filter((v,i)=>want.indexOf(v)===i);
  order.forEach(j => { const c = want.filter(x=>x===j).length; for (let k = 0; k < c && pool.length; k++) {
    pool.sort((a,b) => scoreFor(b,j) - scoreFor(a,j));
    const p = pool.shift(); if (p) p.job = j;
  }});
  if (!workers.some(p => p.job === "woodcutter") && workers.length) workers[0].job = "woodcutter";
  if (!workers.some(p => ["gatherer","hunter","fisher","farmer"].includes(p.job)) && workers.length > 1) workers[1].job = "gatherer";
}
function scoreFor(p, j){ return jobLevel(p,j) * 2 + (p.talent[j]||1) + (p.likes[j] === "love" ? 1.5 : p.likes[j] === "chore" ? -1 : 0); }
function applyManualJobs(){
  if (!S || !S.manualJobs) return;
  const workers = alive().filter(p => p.age >= 18);
  const counts = Object.assign({}, S.jobCounts);
  workers.forEach(p => p.job = "gatherer");
  Object.keys(counts).forEach(j => {
    if (!jobAvailable(j) && j !== "gatherer") counts[j] = 0;
    let c = counts[j] || 0;
    const cand = workers.filter(p => p.job === "gatherer" && j !== "gatherer").sort((a,b)=>scoreFor(b,j)-scoreFor(a,j));
    if (j === "gatherer") return;
    for (let k = 0; k < c && cand.length; k++) cand[k].job = j;
  });
  alive().forEach(p => { if (p.age >= 6 && p.age < 18) p.job = hasB("school") ? "student" : "kid"; if (p.age < 6) p.job = "kid"; });
}
function assignHomes(){
  const homes = S.buildings.filter(b => !b.building && BUILDINGS[b.type].home);
  S.people.forEach(p => p.home = null);
  let hi = 0;
  alive().forEach(p => { while (hi < homes.length && S.people.filter(q => q.home === homes[hi].id).length >= BUILDINGS[homes[hi].type].home) hi++; if (hi < homes.length) p.home = homes[hi].id; });
}

<script>
/* ================= Simulation ================= */
function productionPerDay(){
  const out = { wood: 0, food: 0, water: 0, stone: 0, knowledge: 0, metal: 0, money: 0 };
  const toolBonus = S.researchDone.tools ? 1.3 : 1;
  const mathBonus = S.researchDone.math ? 1.15 : 1;
  const ecoBonus = S.researchDone.ecology ? 1.3 : 1;
  alive().filter(p => p.age >= 18).forEach(p => {
    const m = jobMult(p, p.job) * mathBonus;
    switch (p.job) {
      case "woodcutter": out.wood += 7 * m * toolBonus; break;
      case "gatherer": out.food += 4.2 * m * toolBonus * ecoBonus; out.wood += 1.2 * m; break;
      case "hunter": out.food += 6 * m; break;
      case "fisher": out.food += 5.4 * m; break;
      case "farmer": out.food += 8 * m * ecoBonus; break;
      case "researcher": out.knowledge += 3.4 * m; break;
      case "cook": out.food += 2 * m; out.money += S.era >= 3 ? 4 * m : 0; break;
      case "doctor": case "nurse": out.money += S.era >= 3 ? 2.5 * m : 0; break;
      case "firefighter": case "officer": case "clergy": out.money += S.era >= 3 ? 1.6 * m : 0; break;
    }
  });
  out.water += 6 + countB("well") * 14 + alive().length * 0.4;
  if (S.era >= 2) out.metal += countB("training") * 0 + (S.researchDone.bronze ? alive().filter(p=>p.job==="woodcutter").length * 0.5 : 0);
  if (hasB("factory")) out.money += 9; if (hasB("skyport")) out.money += 16;
  if (hasB("powerplant")) { out.money += 4; }
  return out;
}
function gainXp(p, j, amt){
  if (!p.skills) p.skills = {};
  const like = p.likes[j] === "love" ? 1.4 : p.likes[j] === "chore" ? 0.6 : 1;
  p.skills[j] = (p.skills[j] || 0) + amt * like * (p.talent[j] || 1) * (0.7 + eduLevel(p) * 0.15);
}
function dayRollover(){
  S.year++; S.raidIn--;
  const ps = alive();
  // eat & drink
  S.res.food -= ps.length * 1.0; S.res.water -= ps.length * 0.8;
  let starving = false;
  if (S.res.food < 0) { S.res.food = 0; starving = true; }
  if (S.res.water < 0) { S.res.water = 0; starving = true; }
  if (starving) { ps.forEach(p => p.health -= 12); log("⚠️ Not enough food or water — people are going hungry!"); }
  // aging
  ps.forEach(p => { p.age++; if (p.age > 68 && Math.random() < (p.age - 68) * 0.012) { p.alive = false; log("🕯️ " + p.name + " passed away at " + p.age + "."); } if (p.health <= 0) { p.health = 25; } });
  // healing
  ps.forEach(p => { const care = (hasB("hospital") ? 14 : 4) + (alive().some(q=>q.job==="doctor") ? 10 : 0) + (alive().some(q=>q.job==="nurse") ? 6 : 0); if (p.health < 100) p.health = Math.min(100, p.health + care * (S.researchDone.medicine ? 1.6 : 1)); });
  // couples & babies
  const singles = ps.filter(p => p.age >= 20 && p.age <= 45 && !p.partner);
  for (let i = 0; i + 1 < singles.length; i += 2) { if (Math.random() < 0.5) { singles[i].partner = singles[i+1].id; singles[i+1].partner = singles[i].id; } }
  const homesCap = S.buildings.filter(b => !b.building && BUILDINGS[b.type].home).reduce((a,b) => a + BUILDINGS[b.type].home, 0);
  if (ps.length < homesCap + 2) {
    const couples = ps.filter(p => p.partner && p.age >= 21 && p.age <= 42);
    if (couples.length && Math.random() < 0.45) { const mom = couples[0]; const baby = newPerson(0, mom.x, mom.y); S.people.push(baby); S.bornTotal++; log("👶 " + baby.name + " was born!"); }
  }
  // education
  const cap = hasB("school") ? 100 : 59;
  ps.forEach(p => {
    if (p.job === "student") p.edu = Math.min(cap, p.edu + (alive().some(q=>q.job==="teacher") ? 9 : 5));
    else if (p.age >= 18) p.edu = Math.min(cap, p.edu + 0.7);
  });
  // research strikes
  S.strikeToday = [];
  if (S.researchActive) {
    alive().filter(p => p.job === "researcher").forEach(p => { const c = p.likes.researcher === "chore" ? 0.38 : p.likes.researcher === "love" ? 0.06 : 0.16; if (Math.random() < c) S.strikeToday.push(p.id); });
    if (S.strikeToday.length) log("🥱 " + S.strikeToday.map(id => (S.people.find(p=>p.id===id)||{}).name).join(", ") + " doesn't feel like researching today.");
  }
  // money era tax
  if (S.era >= 3) S.res.money += ps.length * 1.5;
  // raid
  if (S.raidIn <= 0) { startRaid(); S.raidIn = 10; }
  autoJobs(); assignHomes(); checkQuests(); saveGame(false); renderAll();
}
function checkQuests(){
  let moved = true;
  while (moved) { moved = false; const q = QUESTS[S.questIdx]; if (q && q.check(S)) { Object.keys(q.reward).forEach(k => S.res[k] = (S.res[k]||0) + q.reward[k]); S.questsDone[q.id] = true; log("📜 Quest complete: " + q.name + "!"); toast("📜 Quest complete: " + q.name); S.questIdx++; moved = true; } }
}
function startRaid(){
  const fighters = alive().filter(p => p.age >= 18);
  const n = Math.max(1, Math.min(4, Math.round(fighters.length * 0.35)));
  raidFx = { t: 0, raiders: Array.from({length: n}, (_, i) => ({ x: -4 - i * 4, y: 60 + Math.random()*25, hp: 30, el: null })) };
  log("⚔️ Raiders are attacking " + S.cityName + "!");
}
function resolveRaid(){
  const defs = alive().filter(p => p.age >= 18);
  const warriors = defs.filter(p => p.job === "warrior");
  const power = warriors.reduce((a,p) => a + jobMult(p,"warrior"), 0) + defs.length * 0.25;
  const raidPower = raidFx ? raidFx.raiders.length * 1.1 : 1;
  const knocked = [];
  defs.forEach(p => { if (Math.random() < 0.4) { p.downedUntil = S.year + 1; p.health = Math.max(20, p.health - 25); knocked.push(p.name); } });
  if (power >= raidPower) { S.raidsSurvived++; log("🛡️ The raid was driven off!" + (knocked.length ? " Knocked down: " + knocked.join(", ") + " (they'll recover)." : "")); }
  else { const steal = Math.min(S.res.food, 12); S.res.food -= steal; S.res.wood = Math.max(0, S.res.wood - 8); S.raidsSurvived++; log("🏴 Raiders got away with some supplies." + (knocked.length ? " Knocked down: " + knocked.join(", ") + " (they'll recover)." : "")); }
  warriors.forEach(p => gainXp(p, "warrior", 6));
  raidFx = null; checkQuests();
}
function tick(now){
  if (!S) return;
  const dt = Math.min(100, now - lastTick); lastTick = now;
  const dayRate = (dt / DAY_MS) * (S.speed || 1);
  S.dayFrac += dayRate;
  // production
  const prod = productionPerDay();
  Object.keys(prod).forEach(k => S.res[k] += prod[k] * dayRate);
  // building progress
  const builders = alive().filter(p => p.job === "builder" && p.age >= 18);
  S.buildings.filter(b => b.building).forEach((b, idx) => {
    const crew = builders.filter((_, i) => i % Math.max(1, S.buildings.filter(x=>x.building).length) === idx);
    const rate = crew.reduce((a,p) => a + jobMult(p,"builder"), 0) * (S.researchDone.wheel ? 1.3 : 1);
    b.progress += (rate / 5) * dayRate; crew.forEach(p => gainXp(p, "builder", dayRate * 2));
    if (b.progress >= 1) { b.building = false; b.progress = 1; log("🏠 " + BUILDINGS[b.type].name + " finished building!"); autoJobs(); assignHomes(); checkQuests(); }
  });
  // research progress
  if (S.researchActive) {
    const proj = RESEARCH.find(r => r.id === S.researchActive);
    const workers = alive().filter(p => p.job === "researcher" && !(S.strikeToday||[]).includes(p.id));
    const rate = workers.reduce((a,p) => a + jobMult(p,"researcher"), 0) * (S.researchDone.writing ? 1.25 : 1) * (S.researchDone.computers ? 1.5 : 1);
    S.researchProgress += (rate / 3.2) * dayRate;
    workers.forEach(p => gainXp(p, "researcher", dayRate * 2));
    if (proj && S.researchProgress >= proj.days) {
      S.researchDone[proj.id] = true; S.researchSaved[proj.id] = 0; S.researchProgress = 0;
      log("🔬 Research complete: " + proj.name + "!");
      toast("🔬 " + proj.name + " researched!");
      if (proj.toEra !== undefined && proj.toEra > S.era) { S.era = proj.toEra; log("🌟 Welcome to the " + ERAS[S.era] + "!"); }
      S.researchActive = null; autoJobs(); checkQuests();
    }
  }
  // xp for workers
  if (Math.random() < 0.3) alive().filter(p => p.age >= 18).forEach(p => gainXp(p, p.job, dayRate * 1.4));
  // raid animation timer
  if (raidFx) { raidFx.t += dt; if (raidFx.t > 6000) resolveRaid(); }
  if (S.dayFrac >= 1) { S.dayFrac = 0; dayRollover(); }
  renderMap(); renderHud();
}
function startLoop(){ if (tickTimer) cancelAnimationFrame(tickTimer); lastTick = performance.now(); const loop = (t) => { tick(t); tickTimer = requestAnimationFrame(loop); }; tickTimer = requestAnimationFrame(loop); }
function stopLoop(){ if (tickTimer) cancelAnimationFrame(tickTimer); tickTimer = null; }

/* ================= Saving ================= */
function saveGame(notify){
  if (!S || activeSlot < 0) return;
  store.slots[activeSlot] = { fileName: store.slots[activeSlot] ? store.slots[activeSlot].fileName : ("File " + (activeSlot+1)), savedAt: Date.now(), state: S };
  saveStore();
  const el = $("hudSave"); if (el) el.textContent = "💾 Saved " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  if (notify) toast("💾 Saved");
}
setInterval(() => { if (S && activeSlot >= 0) saveGame(false); }, 5000);
</script>
<script>
/* ================= Rendering ================= */
const RESDEF = [["wood","🪵"],["food","🍖"],["water","💧"],["stone","🪨"],["knowledge","📚"],["metal","⛓️"],["money","💰"]];

  $("hudYear").textContent = "Year " + S.year + " · " + ERAS[S.era] + " · 👥 " + alive().length + " · ⚔️ raid in " + S.raidIn;
  $("resbar").innerHTML = RESDEF.filter(([k]) => k !== "money" || S.era >= 3).filter(([k]) => k !== "metal" || S.era >= 2).map(([k, ic]) => {

    if (Math.random() < 0.02 || (p.tx === 0 && p.ty === 0)) { p.tx = 6 + Math.random() * 88; p.ty = 58 + Math.random() * 34; }
    const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
    if (dist < 2) { p.tx = 6 + Math.random() * 88; p.ty = 58 + Math.random() * 34; }
    else { p.x += dx / dist * 0.55; p.y += dy / dist * 0.55; }
    const downed = p.downedUntil && S.year < p.downedUntil;

    const act = p.job === "woodcutter" ? "🪓" : p.job === "builder" ? "🔨" : p.job === "researcher" ? ((S.strikeToday||[]).includes(p.id) ? "🥱" : "📖") : p.job === "hunter" ? "🏹" : p.job === "fisher" ? "🎣" : p.job === "farmer" ? "🌾" : "";
    el.style.left = p.x + "%"; el.style.top = p.y + "%";

function renderAll(){ renderHud(); renderMap(); renderLog(); renderPanel(); }

/* ================= Panels ================= */
function costText(cost){ return Object.keys(cost).map(k => (RESDEF.find(r=>r[0]===k)||["",k])[1] + " " + cost[k]).join(" · "); }
function canAfford(cost){ return Object.keys(cost).every(k => (S.res[k]||0) >= cost[k]); }
function payCost(cost){ Object.keys(cost).forEach(k => S.res[k] -= cost[k]); }
function renderPanel(){

    "<br>❤️ Health: " + Math.round(p.health) + "%" +
    (skills ? "<br><br>⭐ <b>Job skills</b><br>" + skills : "") +
    '<br><br><span class="small">Job levels grow by doing the job — talent and loving the job make XP faster. Levels are separate from education.</span></p><div class="row"><button class="btn-alt" onclick="selPerson=null;renderPanel()">← Back</button></div></div>';
}
/* ================= Actions ================= */
function queueBuild(t){
  const d = BUILDINGS[t]; if (!canAfford(d.cost)) { toast("Not enough resources"); return; }
  payCost(d.cost);
  const spots = [[14,64],[30,72],[46,63],[62,72],[78,64],[22,82],[55,84],[84,82],[38,86],[70,86]];
  const used = S.buildings.length % spots.length;
  S.buildings.push({ id: uidC++, type: t, x: spots[used][0], y: spots[used][1], building: true, progress: 0, tier: d.tier || 0 });
  toast("🚧 " + d.name + " queued!"); if (!alive().some(p => p.job === "builder")) autoJobs(); saveGame(false); renderAll();
}
function queueUpgrade(id, up){
  const b = S.buildings.find(x => x.id === id); const d = BUILDINGS[up]; if (!b || !canAfford(d.cost)) { toast("Not enough resources"); return; }
  payCost(d.cost); b.type = up; b.building = true; b.progress = 0; b.tier = d.tier || 0;
  toast("🚧 Upgrading to " + d.name + "!"); autoJobs(); saveGame(false); renderAll();
}
function sellRes(k, amt, price){ if ((S.res[k]||0) < amt) { toast("Not enough to sell"); return; } S.res[k] -= amt; S.res.money += price; toast("💰 Sold!"); saveGame(false); renderAll(); }
function startResearch(id){ if (S.researchActive && S.researchActive !== id) S.researchSaved[S.researchActive] = S.researchProgress; S.researchActive = id; S.researchProgress = S.researchSaved[id] || 0; autoJobs(); saveGame(false); renderPanel(); }
function pauseResearch(){ if (S.researchActive) { S.researchSaved[S.researchActive] = S.researchProgress; S.researchActive = null; } saveGame(false); renderPanel(); }
function toggleManual(){ S.manualJobs = !S.manualJobs; if (S.manualJobs) { S.jobCounts = {}; Object.keys(JOBS).forEach(j => S.jobCounts[j] = alive().filter(p=>p.job===j && p.age>=18).length); } else autoJobs(); saveGame(false); renderPanel(); }
function adjJob(j, d){ S.jobCounts[j] = Math.max(0, (S.jobCounts[j]||0) + d); applyManualJobs(); saveGame(false); renderPanel(); }
function setSpeed(v){ S.speed = v; saveGame(false); renderPanel(); }
function renameCity(){ const v = $("cityNameIn").value.trim(); if (v) { S.cityName = v; toast("Renamed to " + v); } saveGame(false); renderAll(); }
function restartCity(){ if (!confirm("Restart this city from Year 1? This wipes this file.")) return; const name = S.cityName; S = newGame(name); saveGame(false); renderAll(); toast("Fresh start!"); }
function backToFiles(){ saveGame(false); stopLoop(); S = null; activeSlot = -1; showFiles(); }

/* ================= Files screen ================= */
function showFiles(){
  $("gameScreen").style.display = "none"; $("filesScreen").style.display = "block";
  $("slots").innerHTML = store.slots.map((s, i) => {
    if (!s) return '<div class="slot"><div class="slot-title">📁 File ' + (i+1) + ' — Empty</div><div class="slot-meta">Start a brand-new city in this file</div><div class="row"><input type="text" id="cityIn' + i + '" placeholder="Name your city"><button onclick="startNew(' + i + ')">▶ Start</button></div></div>';
    const st = s.state;
    return '<div class="slot"><div class="slot-title">📁 ' + esc(s.fileName) + ' — ' + esc(st.cityName) + '</div><div class="slot-meta">Year ' + st.year + " · " + ERAS[st.era] + " · 👥 " + st.people.filter(p=>p.alive).length + " people · saved " + new Date(s.savedAt).toLocaleString() + '</div><div class="row"><button onclick="loadSlot(' + i + ')">▶ Load</button><input type="text" id="fileIn' + i + '" placeholder="Rename this file" value="' + esc(s.fileName) + '"><button class="btn-alt" onclick="renameSlot(' + i + ')">Rename</button><button class="btn-danger" onclick="deleteSlot(' + i + ')">Delete</button></div></div>';
  }).join("");
}
function startNew(i){ const v = ($("cityIn" + i).value || "").trim() || "New City"; activeSlot = i; S = newGame(v); store.slots[i] = { fileName: "File " + (i+1), savedAt: Date.now(), state: S }; saveStore(); enterGame(); }
function loadSlot(i){ const s = store.slots[i]; if (!s) return; activeSlot = i; S = s.state; uidC = 10000 + Math.floor(Math.random()*1000) + S.year; enterGame(); }
function renameSlot(i){ const v = ($("fileIn" + i).value || "").trim(); if (v && store.slots[i]) { store.slots[i].fileName = v; saveStore(); } showFiles(); }
function deleteSlot(i){ if (!confirm("Delete File " + (i+1) + "? This can't be undone.")) return; store.slots[i] = null; saveStore(); showFiles(); }
function enterGame(){
  $("filesScreen").style.display = "none"; $("gameScreen").style.display = "block";
  personEls.clear(); bldgEls.clear(); $("mapWrap").innerHTML = "";
  // religions arrive in the modern era
  alive().forEach(p => { if (S.era >= 3 && !p.religion) p.religion = RELIGIONS[Math.floor(Math.random()*RELIGIONS.length)]; });
  tab = "build"; renderAll(); startLoop();
}
document.querySelectorAll("#tabbar button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; selPerson = null; renderPanel(); }));
showFiles();
</script>
</body>
</html>
